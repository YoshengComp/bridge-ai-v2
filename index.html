<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bridge AI V2</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="header">

        <div class="logo">

            🤖 Bridge AI

            <span class="version">V2</span>

        </div>

    </div>

    <!-- Chat -->

    <div id="chat"
         class="chat">

        <div class="ai-card">

            <div class="welcome">

                <h2>
                    👋 您好，歡迎使用 Bridge AI
                </h2>

                <p>
                    我是您的 ERP AI 助理。
                </p>

                <p>
                    您可以直接詢問：
                </p>

            </div>

            <div class="quick-area">

                <button class="quick-btn">
                    📦 缺貨怎麼辦？
                </button>

                <button class="quick-btn">
                    🛒 如何建立採購單？
                </button>

                <button class="quick-btn">
                    👥 如何新增供應商？
                </button>

                <button class="quick-btn">
                    📄 如何建立報價單？
                </button>

            </div>

        </div>

    </div>

    <!-- Footer -->

    <div class="footer">

        <input
            id="question"
            type="text"
            placeholder="請輸入您的問題...">

        <button id="send">

            ➜

        </button>

    </div>

</div>

<script src="app.js"></script>

</body>

</html>
